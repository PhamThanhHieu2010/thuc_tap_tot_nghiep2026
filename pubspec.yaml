name: smart_manager_firebase
description: Ứng dụng quản lý tài chính online Firebase
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 1. Quản lý trạng thái
  provider: ^6.1.2

  # 2. Kết nối mạng
  http: ^1.2.1

  # 3. Tiện ích & Định dạng & Lưu trữ
  intl: ^0.19.0           # Định dạng tiền tệ, ngày tháng
  shared_preferences: ^2.2.2 # Lưu phiên đăng nhập
  google_fonts: ^6.2.1    # Font chữ đẹp
  
  # --- CÁC THƯ VIỆN TIỆN ÍCH ---
  path_provider: ^2.1.2   # Tìm đường dẫn bộ nhớ
  permission_handler: ^11.3.0 # Xin quyền truy cập (quan trọng cho Android 13+)

  # 4. Giao diện & Biểu đồ
  fl_chart: ^0.66.2       # Biểu đồ thống kê
  animate_do: ^3.3.4      # Hiệu ứng chuyển động
  table_calendar: ^3.1.1  # Lịch chi tiêu
  cupertino_icons: ^1.0.8

  # 5. Tính năng nâng cao (Camera & OCR & QR)
  qr_flutter: ^4.1.0      # Mã QR
  image_picker: ^1.0.7    # Chụp ảnh/Chọn ảnh
  
  # [BỔ SUNG QUAN TRỌNG CHO TÍNH NĂNG QUÉT HÓA ĐƠN]
  google_mlkit_text_recognition: ^0.11.0 

  # 6. Xuất File & Chia sẻ
  csv: ^6.0.0             # Tạo file dữ liệu
  share_plus: ^9.0.0      # Chia sẻ file ra Zalo/Mail
  url_launcher: ^6.2.5    # Mở liên kết web/hỗ trợ

  # 7. AI & Thông báo
  google_generative_ai: ^0.4.0 
  flutter_markdown: ^0.7.3     
  flutter_local_notifications: ^17.1.0
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Đảm bảo bạn đã tạo thư mục này trong dự án thật
  assets:
    - assets/images/
    - assets/icons/